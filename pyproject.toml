[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-agent"
version = "0.1.0"
description = "Cryptographic capability sealing, scope-bounded planning, and independent audit for LLM agents"
readme = "README.md"
license = "MIT"
authors = [
    {name = "jtevesnz-sys", email = "jtevesnz-sys@users.noreply.github.com"}
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/jtevesnz-sys/governed-agent"
Documentation = "https://github.com/jtevesnz-sys/governed-agent/blob/main/WHITE_PAPER.md"
Repository = "https://github.com/jtevesnz-sys/governed-agent.git"
Issues = "https://github.com/jtevesnz-sys/governed-agent/issues"
Discussions = "https://github.com/jtevesnz-sys/governed-agent/discussions"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
